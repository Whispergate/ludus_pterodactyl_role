---
###############################################################################
# SSL certificate provisioning.
#
#   none        -> nothing to do (plain HTTP).
#   selfsigned  -> generate a self-signed cert with openssl (offline friendly).
#   letsencrypt -> obtain a trusted cert with certbot. Needs the domain to
#                  resolve to this VM and inbound port 80 reachable from the
#                  internet. If issuance fails and fallback is enabled, a
#                  self-signed cert is generated so the panel still comes up.
###############################################################################

# --- Self-signed -----------------------------------------------------------
- name: Provision a self-signed certificate
  ansible.builtin.include_tasks: ssl_selfsigned.yml
  when: ludus_pterodactyl_ssl_mode == "selfsigned"

# --- Let's Encrypt ---------------------------------------------------------
- name: Provision a Let's Encrypt certificate
  when: ludus_pterodactyl_ssl_mode == "letsencrypt"
  block:
    - name: Refuse Let's Encrypt for a bare IP address
      ansible.builtin.assert:
        that:
          - not ludus_pterodactyl_domain_is_ip
        fail_msg: >-
          Let's Encrypt cannot issue certificates for an IP address. Set
          ludus_pterodactyl_domain to a publicly-resolvable FQDN or use the
          'selfsigned' SSL mode.

    - name: Install certbot
      ansible.builtin.apt:
        name:
          - certbot
        state: present
        update_cache: true

    - name: Check whether a Let's Encrypt certificate already exists
      ansible.builtin.stat:
        path: "{{ ludus_pterodactyl_effective_cert }}"
      register: ludus_pterodactyl_le_cert

    - name: Stop nginx so certbot can bind port 80 (standalone challenge)
      ansible.builtin.systemd:
        name: nginx
        state: stopped
      when: not ludus_pterodactyl_le_cert.stat.exists
      failed_when: false

    - name: Obtain the certificate with certbot (standalone)
      ansible.builtin.command:
        cmd: >-
          certbot certonly --standalone --non-interactive --agree-tos
          -m {{ ludus_pterodactyl_letsencrypt_email }}
          -d {{ ludus_pterodactyl_domain }}
        creates: "{{ ludus_pterodactyl_effective_cert }}"
      register: ludus_pterodactyl_certbot
      # Don't abort the whole deploy on a failed challenge; handle it below.
      failed_when: false

    - name: Confirm whether the certificate was issued
      ansible.builtin.stat:
        path: "{{ ludus_pterodactyl_effective_cert }}"
      register: ludus_pterodactyl_le_cert_after

    - name: Install a renewal hook that reloads nginx
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        mode: "0755"
        content: |
          #!/bin/sh
          systemctl reload nginx
      when: ludus_pterodactyl_le_cert_after.stat.exists

    # --- Issuance failed ---------------------------------------------------
    - name: Fail when Let's Encrypt issuance failed and fallback is disabled
      ansible.builtin.fail:
        msg: >-
          Let's Encrypt could not issue a certificate for
          {{ ludus_pterodactyl_domain }}. The ACME server must be able to reach
          this VM on port 80 from the internet (check that the domain resolves
          to this host and that inbound :80 is forwarded to it). Set
          ludus_pterodactyl_ssl_mode=selfsigned, fix inbound :80, or leave
          ludus_pterodactyl_letsencrypt_fallback_selfsigned enabled.
      when:
        - not ludus_pterodactyl_le_cert_after.stat.exists
        - not (ludus_pterodactyl_letsencrypt_fallback_selfsigned | bool)

    - name: Fall back to a self-signed certificate
      when:
        - not ludus_pterodactyl_le_cert_after.stat.exists
        - ludus_pterodactyl_letsencrypt_fallback_selfsigned | bool
      block:
        - name: Warn that Let's Encrypt failed and self-signed is being used
          ansible.builtin.debug:
            msg: >-
              Let's Encrypt issuance for {{ ludus_pterodactyl_domain }} failed;
              falling back to a self-signed certificate so the panel can start.
              Fix inbound :80 and re-run to obtain a trusted certificate.

        - name: Point the webserver at the self-signed cert location
          ansible.builtin.set_fact:
            ludus_pterodactyl_effective_cert: "{{ ludus_pterodactyl_selfsigned_dir }}/fullchain.pem"
            ludus_pterodactyl_effective_key: "{{ ludus_pterodactyl_selfsigned_dir }}/privkey.pem"

        - name: Generate the self-signed fallback certificate
          ansible.builtin.include_tasks: ssl_selfsigned.yml
