---
###############################################################################
# Panel dependencies: PHP, MariaDB, nginx, Redis, Composer
###############################################################################

- name: Install base prerequisite packages
  ansible.builtin.apt:
    name:
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - curl
      - tar
      - unzip
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: ludus_pterodactyl_apt_base
  until: ludus_pterodactyl_apt_base is succeeded
  retries: 3
  delay: 5

# --- PHP repository ---------------------------------------------------------
# Only added when the distro doesn't already ship the requested PHP version.
# The repos are added via a direct keyring + deb line rather than the `ppa:`
# helper, which avoids the slow/rate-limited Launchpad metadata API.
- name: Add the third-party PHP repository
  when: ludus_pterodactyl_manage_php_repo | bool
  block:
    - name: Add ondrej/php signing key (Ubuntu)
      ansible.builtin.get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x14AA40EC0831756756D7F66C4F4EA0AAE5267A6C"
        dest: "/usr/share/keyrings/ondrej-php.asc"
        mode: "0644"
      register: ludus_pterodactyl_ondrej_key
      until: ludus_pterodactyl_ondrej_key is succeeded
      retries: 3
      delay: 5
      when: ansible_distribution == "Ubuntu"

    - name: Add ondrej/php repository (Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/ondrej-php.asc] https://ppa.launchpadcontent.net/ondrej/php/ubuntu {{ ansible_distribution_release }} main"
        filename: "ondrej-php"
        state: present
        update_cache: false
      when: ansible_distribution == "Ubuntu"

    - name: Add Sury PHP repository key (Debian)
      ansible.builtin.get_url:
        url: "https://packages.sury.org/php/apt.gpg"
        dest: "/usr/share/keyrings/deb.sury.org-php.gpg"
        mode: "0644"
      register: ludus_pterodactyl_sury_key
      until: ludus_pterodactyl_sury_key is succeeded
      retries: 3
      delay: 5
      when: ansible_distribution == "Debian"

    - name: Add Sury PHP repository (Debian)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main"
        filename: "sury-php"
        state: present
        update_cache: false
      when: ansible_distribution == "Debian"

# --- Packages ---------------------------------------------------------------
- name: Install PHP, MariaDB, nginx and Redis
  ansible.builtin.apt:
    name: "{{ ludus_pterodactyl_php_packages + ludus_pterodactyl_service_packages }}"
    state: present
    update_cache: true
  register: ludus_pterodactyl_apt_main
  until: ludus_pterodactyl_apt_main is succeeded
  retries: 3
  delay: 5
  vars:
    ludus_pterodactyl_service_packages:
      - mariadb-server
      - nginx
      - redis-server
      - python3-pymysql

- name: Install Composer v2
  ansible.builtin.shell:
    cmd: >-
      curl -sS https://getcomposer.org/installer |
      php -- --install-dir=/usr/local/bin --filename=composer
    creates: /usr/local/bin/composer

# --- Ensure core services are running --------------------------------------
- name: Ensure MariaDB, Redis and php-fpm are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - mariadb
    - redis-server
    - "{{ ludus_pterodactyl_php_fpm_service }}"
